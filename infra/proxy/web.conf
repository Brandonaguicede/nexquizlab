# Proxied APIs send their own CSP for local documentation assets; an empty value omits this one.
# $request_uri (not $uri): the API locations rewrite $uri, which would otherwise select the strict web policy.
map $request_uri $nexquiz_csp {
  ~^/(auth|game)/ "";
  default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";
}
# WebSocket upgrades for the Game realtime channel (Socket.IO).
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy $nexquiz_csp always;
  # Resolve API containers per request through Docker DNS: a recreated container gets a new IP,
  # and a hostname resolved only at startup would keep proxying to the old one (502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth_api auth-api:3001;
  set $game_api game-api:3002;
  location /auth/ { rewrite ^/auth/(.*)$ /$1 break; proxy_pass http://$auth_api; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Prefix /auth; proxy_set_header Host $host; }
  location /game/socket.io/ {
    rewrite ^/game/(.*)$ /$1 break;
    proxy_pass http://$game_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /game;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location /game/ { rewrite ^/game/(.*)$ /$1 break; proxy_pass http://$game_api; proxy_set_header X-Forwarded-Prefix /game; proxy_set_header Host $host; }
  location /assets/ { expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
