name: NexQuiz foundation and identity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - name: Require resolved dependency lock
        run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup.cjs
      - run: pnpm prepare:scalar
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:docs
      - name: Real identity stack and PostgreSQL acceptance
        env:
          POSTGRES_PORT: '55432'
          NEXQUIZ_TEST_DB_PORT: '55432'
        run: |
          docker compose up -d --build --wait
          pnpm test:identity:db
          pnpm test:identity
          node scripts/verify-http.cjs
      - run: pnpm audit:repository
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        run: DOCKERHUB_USER=nexquiz-validation docker compose -f docker-compose.prod.yml config --quiet
